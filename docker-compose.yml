services:
  postgres:
    image: postgres:16-alpine
    container_name: creator_marketplace_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: creator_marketplace
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: creator_marketplace_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/creator_marketplace
      SESSION_SECRET: dev_super_secret_signing_key_32bytes_minimum_length_required!
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
